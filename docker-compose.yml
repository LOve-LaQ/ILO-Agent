# Docker Compose for ILO-Agent Demo
# 一键启动所有服务:
# - Redis (缓存)
# - Qdrant (向量数据库)
# - FastAPI Backend (可选，本地运行更方便)

version: '3.8'

services:
  # Redis - 短期记忆存储
  redis:
    image: redis:alpine
    container_name: ilo-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant - 向量数据库（长期记忆）
  qdrant:
    image: qdrant/qdrant
    container_name: ilo-agent-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  qdrant_data:

networks:
  default:
    name: ilo-agent-network
