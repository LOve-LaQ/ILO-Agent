# Docker Compose for ILO-Agent Demo
# 一键启动所有服务:
# - Redis (缓存)
# - Qdrant (向量数据库)
# - FastAPI Backend (可选，本地运行更方便)

version: '3.8'

services:
  # Redis - 短期记忆存储
  redis:
    image: redis:alpine
    container_name: ilo-agent-redis
    # Docker Desktop 重启后容器会被停止且不会自恢复，必须显式声明重启策略
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant - 向量数据库（长期记忆）
  qdrant:
    image: qdrant/qdrant
    container_name: ilo-agent-qdrant
    # 同上：没有重启策略时，Docker Desktop 一重启 Qdrant 就静默停摆，
    # 首页会降级成 FALLBACK_NEWS 的 3 条示例卡片
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant 镜像里没有 curl/wget，只能用 bash 自带的 /dev/tcp 探端口
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  qdrant_data:

networks:
  default:
    name: ilo-agent-network
